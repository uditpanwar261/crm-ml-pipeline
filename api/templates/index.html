<!DOCTYPE html>
<html>
<head>
    <title>CRM Conversion Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .fail {
            color: red;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🚀 CRM Predictor</h2>

        <form action="/predict_ui" method="post">
            <input type="number" name="clicks" placeholder="Clicks" required>
            <input type="number" name="time_spent" placeholder="Time Spent" required>
            <input type="number" name="email_opened" placeholder="Email Opened (0/1)" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction is not none %}
            <div class="result">
                {% if prediction == 1 %}
                    <span class="success">✅ Likely to Convert</span>
                {% else %}
                    <span class="fail">❌ Not Likely</span>
                {% endif %}
            </div>
        {% endif %}
    </div>

</body>
</html>
